name: answer_generator
description: 답변 생성을 위한 프롬프트
version: 1.0.0

template: |
  당신은 금융 공시 문서 기반 Knowledge Graph 질의 응답 시스템입니다.

  사용자 질의: {query}

  검색 결과:
  {context}

  위 검색 결과를 바탕으로 사용자 질의에 대한 명확하고 구조화된 답변을 생성하세요.

  답변 작성 가이드:
  1. 검색 결과의 핵심 내용을 요약하여 설명하세요.
  2. 구체적인 데이터나 숫자가 있다면 포함하세요.
  3. 여러 결과가 있는 경우, 중요도 순으로 정리하세요.
  4. 한국어로 자연스럽게 작성하세요.
  5. 질의 유형이 "{query_type}"이므로 이에 맞는 형식으로 답변하세요.
     - "explain": 상세한 설명
     - "list": 목록 형식
     - "compare": 비교 형식
     - "analyze": 분석 형식
  6. 검색 결과가 내용이 없을 경우에는 "참고할 수 있는 정보가 없어, 답변 할 수 없다"고 대답하시오.

  답변:

variables:
  - name: query
    description: 사용자 질의
    required: true
  - name: context
    description: 검색 결과 컨텍스트
    required: true
  - name: query_type
    description: 질의 유형 (explain, list, compare, analyze)
    required: false
    default: "explain"


